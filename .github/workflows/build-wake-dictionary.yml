name: Build and Deploy WAKE Dictionary

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-wake-dictionary.yml"
      - "api/**"
      - "lib/**"
      - "scripts/**"
      - "src/**"
      - "data/**"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
  workflow_dispatch:
    inputs:
      force_full_refresh:
        description: "Force one full aggregate cache refresh"
        required: false
        default: false
        type: boolean
  schedule:
    # JST 08:00 = UTC 23:00 (previous day)
    - cron: "0 23 * * *"

concurrency:
  group: wake-dictionary-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node24-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-npm-

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Refresh racer grade and branch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/collect_racer_profiles.mjs

      - name: Refresh official racer kana
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RACER_KANA_CONCURRENCY: "6"
        run: node scripts/collect_racer_kana.mjs

      - name: Refresh official women racer list
        run: node scripts/collect_women_racers.mjs

      - name: Refresh incremental aggregate cache
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          WAKE_FORCE_FULL_REFRESH: ${{ inputs.force_full_refresh && '1' || '0' }}
          WAKE_RACER_BATCH_SIZE: "50"
          WAKE_VENUE_BATCH_SIZE: "50"
          WAKE_KIMARITE_BATCH_SIZE: "10"
          WAKE_DEFENSE_BATCH_SIZE: "20"
          WAKE_VENUE_COURSE_BATCH_SIZE: "25"
          WAKE_RECENT_CORRECTION_RECHECK_DAYS: "3"
        run: node scripts/refresh_incremental_cache.mjs

      - name: Generate static JSON from cache
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          WAKE_DICTIONARY_OUT_DIR: public/data
          WAKE_WOMEN_RACERS_FILE: data/women_racers.json
        run: node scripts/export_wake_dictionary.mjs

      - name: Generate historical women / mixed race rankings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          WAKE_DICTIONARY_OUT_DIR: public/data
          WAKE_WOMEN_RACERS_FILE: data/women_racers.json
        run: node scripts/export_historical_race_classes.mjs

      - name: Today entries + validation in parallel
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VERIFY_A1_REGNO: ${{ vars.VERIFY_A1_REGNO }}
          VERIFY_A2_REGNO: ${{ vars.VERIFY_A2_REGNO }}
          VERIFY_B1_REGNO: ${{ vars.VERIFY_B1_REGNO }}
          WAKE_DICTIONARY_OUT_DIR: public/data
          TODAY_ENTRIES_CONCURRENCY: "10"
          TODAY_ENTRIES_WAIT_MINUTES: "30"
          TODAY_ENTRIES_RETRY_MINUTES: "5"
          TODAY_ENTRIES_REQUIRED: "0"
          WAKE_WOMEN_RACERS_FILE: data/women_racers.json
        shell: bash
        run: |
          set +e
          node scripts/collect_today_entries.mjs > /tmp/today.log 2>&1 &
          TODAY_PID=$!
          node scripts/validate_wake_dictionary.mjs > /tmp/validate.log 2>&1 &
          VALIDATE_PID=$!

          wait "$TODAY_PID"; TODAY_STATUS=$?
          wait "$VALIDATE_PID"; VALIDATE_STATUS=$?

          echo "===== today entries ====="
          cat /tmp/today.log
          echo "===== validation ====="
          cat /tmp/validate.log

          if [ "$TODAY_STATUS" -ne 0 ] || [ "$VALIDATE_STATUS" -ne 0 ]; then
            echo "Pre-deploy checks failed. Production remains on the previous successful deployment."
            exit 1
          fi

      - name: Confirm generated data exists
        shell: bash
        run: |
          test -f public/data/index.json
          test -f public/data/meta/baselines.json
          test -f public/data/index/reverse_catalog.json
          test -f public/data/index/ranking_catalog.json
          test -f public/data/today_entries.json
          test -f public/data/index/ranking_source.json
          test -f public/data/index/historical_race_classes.json
          test -d public/data/features
          FEATURE_COUNT="$(find public/data/features -type f -name '*.json' | wc -l)"
          echo "feature_files=$FEATURE_COUNT"
          test "$FEATURE_COUNT" -gt 1000
          echo "public/data ready"
          du -sh public/data
          find public/data/racers -type f | wc -l

      - name: Stage private paid data
        shell: bash
        run: |
          rm -rf private-data
          mv public/data private-data
          test -f private-data/index.json
          test ! -e public/data
          echo "Paid JSON staged outside Vite public directory."

      # v1.5.3:
      # .vercel/project.json を手作りしない。
      # Project ID / Org ID の取り違えを避けるため、
      # Vercel CLI自身に team slug + project name でリンクさせる。
      - name: Link Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          rm -rf .vercel
          npx --yes vercel@59.1.3 link \
            --yes \
            --project wake-dictionary \
            --scope hunaken-akademia \
            --token="$VERCEL_TOKEN"

      - name: Sync Google access environment to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          WAKE_DICTIONARY_ADMIN_EMAILS: "aru020940@gmail.com"
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SUPABASE_URL" | npx --yes vercel@59.1.3 env add SUPABASE_URL production \
            --force --sensitive --scope hunaken-akademia --token="$VERCEL_TOKEN"
          printf '%s' "$SUPABASE_SERVICE_KEY" | npx --yes vercel@59.1.3 env add SUPABASE_SERVICE_KEY production \
            --force --sensitive --scope hunaken-akademia --token="$VERCEL_TOKEN"
          printf '%s' "$WAKE_DICTIONARY_ADMIN_EMAILS" | npx --yes vercel@59.1.3 env add WAKE_DICTIONARY_ADMIN_EMAILS production \
            --force --scope hunaken-akademia --token="$VERCEL_TOKEN"
          echo "Google access environment variables synchronized."

      - name: Pull Vercel production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@59.1.3 pull \
            --yes \
            --environment=production \
            --scope hunaken-akademia \
            --token="$VERCEL_TOKEN"

      - name: Deploy production to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOY_URL="$(npx --yes vercel@59.1.3 deploy \
            --prod \
            --yes \
            --scope hunaken-akademia \
            --token="$VERCEL_TOKEN")"
          echo "Production deployment: $DEPLOY_URL"
          echo "WAKE_DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"

      # Deployment URL はVercelのDeployment ProtectionでHTMLログイン画面を返す場合がある。
      # public/data自体は直前の Confirm generated data exists で検証済みなので、
      # 最後はVercel API認証を使うCLI inspectでデプロイ成立を確認する。
      - name: Verify Vercel deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          echo "Inspecting: $WAKE_DEPLOY_URL"
          npx --yes vercel@59.1.3 inspect \
            "$WAKE_DEPLOY_URL" \
            --scope hunaken-akademia \
            --token="$VERCEL_TOKEN"
          echo "Vercel deployment verified."

      - name: Production safety note
        if: failure()
        run: echo "Deployment did not complete; the previous Vercel production deployment remains active."
