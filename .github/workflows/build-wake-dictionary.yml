name: Build and Deploy WAKE Dictionary

on:
  workflow_dispatch:
  schedule:
    # JST 04:30 = UTC 19:30 (previous day)
    - cron: "30 19 * * *"

concurrency:
  group: wake-dictionary-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Refresh racer grade and branch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/collect_racer_profiles.mjs

      - name: Generate static JSON
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          WAKE_DICTIONARY_OUT_DIR: public/data
        run: node scripts/export_wake_dictionary.mjs

      - name: Validate global aggregates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VERIFY_A1_REGNO: ${{ vars.VERIFY_A1_REGNO }}
          VERIFY_A2_REGNO: ${{ vars.VERIFY_A2_REGNO }}
          VERIFY_B1_REGNO: ${{ vars.VERIFY_B1_REGNO }}
          WAKE_DICTIONARY_OUT_DIR: public/data
        run: node scripts/validate_wake_dictionary.mjs

      - name: Confirm generated data exists
        shell: bash
        run: |
          test -f public/data/index.json
          test -f public/data/meta/baselines.json
          test -f public/data/index/reverse_catalog.json
          test -f public/data/index/ranking_catalog.json
          echo "public/data ready"
          du -sh public/data
          find public/data/racers -type f | wc -l

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # v1.5.3:
      # .vercel/project.json を手作りしない。
      # Project ID / Org ID の取り違えを避けるため、
      # Vercel CLI自身に team slug + project name でリンクさせる。
      - name: Link Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          rm -rf .vercel
          vercel link \
            --yes \
            --project wake-dictionary \
            --scope hunaken-akademia \
            --token="$VERCEL_TOKEN"

      - name: Pull Vercel production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --scope hunaken-akademia \
            --token="$VERCEL_TOKEN"

      - name: Deploy production to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOY_URL="$(vercel deploy \
            --prod \
            --yes \
            --scope hunaken-akademia \
            --token="$VERCEL_TOKEN")"
          echo "Production deployment: $DEPLOY_URL"
          echo "WAKE_DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"

      - name: Verify deployed JSON
        shell: bash
        run: |
          sleep 5
          curl --fail --silent --show-error --location \
            "$WAKE_DEPLOY_URL/data/index.json" \
            --output /tmp/index.json
          node -e '
            const fs=require("fs");
            const x=JSON.parse(fs.readFileSync("/tmp/index.json","utf8"));
            if (!Array.isArray(x) || x.length < 1000) {
              throw new Error("deployed /data/index.json is invalid");
            }
            console.log(`deployed racers=${x.length}`);
          '
